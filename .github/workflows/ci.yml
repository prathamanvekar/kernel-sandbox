name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libseccomp-dev libcap-dev
      - name: Build
        run: make all check-bins
      - name: Adversarial and false-deny gates
        run: make check
      - name: Microbench smoke
        run: SAMPLES=20 ITERS=500 make microbench
